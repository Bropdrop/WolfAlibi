name: Shirudo adapter checks

on:
  pull_request:
    paths:
      - 'shirudo_adapter/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/shirudo-adapter.yml'
  push:
    branches: ['feat/shirudo-evidence-verifier-v1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install adapter
        run: python -m pip install .
      - name: Unit and hostile subprocess cases
        run: python -m unittest discover -s tests -v
      - name: Synthetic CLI demonstration
        run: python scripts/demo_shirudo.py
