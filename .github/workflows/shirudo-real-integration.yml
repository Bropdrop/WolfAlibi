name: Shirudo real integration

on:
  push:
    branches: ['feat/shirudo-real-integration-v1']
    paths:
      - 'shirudo_adapter/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/shirudo-real-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shirudo-real-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_COMMIT: fb97c1ec5908c8bdbd46760c29e57677977fce74
  WOLFALIBI_DISPOSABLE_CI: '1'

jobs:
  offline:
    name: Genuine verifier and historical fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      binary_ready: ${{ steps.gate.outputs.binary_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shirudo-dev/shirudo
          ref: fb97c1ec5908c8bdbd46760c29e57677977fce74
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install adapter
        run: python -m pip install .
      - name: Download pinned official artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh api repos/shirudo-dev/shirudo/actions/artifacts/14865910776/zip > artifacts/upstream.zip
          python scripts/prepare_shirudo_binary.py --archive artifacts/upstream.zip --output artifacts/verifier
      - name: Run genuine historical-fixture gate
        id: gate
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          set +e
          python scripts/shirudo_real_offline.py --upstream "$PWD/upstream" --verifier "$PWD/artifacts/verifier/shirudo" --output "$PWD/evidence/offline"
          gate_status=$?
          set -e
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path('evidence/offline/gate-a-report.json')
          ready = report.exists() and json.loads(report.read_text()).get('binary_ready') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'binary_ready={str(ready).lower()}\n')
          PY
          exit "$gate_status"
      - name: Retain historical evidence and artifact provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shirudo-real-offline-${{ github.sha }}
          path: |
            evidence/offline/
            artifacts/verifier/artifact.json
          if-no-files-found: error
          retention-days: 14

  fresh-lab:
    name: Fresh Shirudo quote with a lab vTPM
    needs: offline
    # A historical corpus rejection does not prevent a fresh-target test if
    # the exact approved executable started successfully. Both jobs retain
    # their own verdict; this condition cannot turn the first gate green.
    if: ${{ always() && !cancelled() && needs.offline.outputs.binary_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VM_NAME: wolfalibi-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shirudo-dev/shirudo
          ref: fb97c1ec5908c8bdbd46760c29e57677977fce74
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install adapter
        run: python -m pip install .
      - name: Check disposable host and KVM before building
        run: |
          mkdir -p evidence
          sudo env GITHUB_ACTIONS=true WOLFALIBI_DISPOSABLE_CI=1 prlimit --memlock=unlimited:unlimited -- python3 scripts/shirudo_ci_preflight.py --output "$PWD/evidence/preflight.json"
      - name: Download pinned official verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh api repos/shirudo-dev/shirudo/actions/artifacts/14865910776/zip > artifacts/upstream.zip
          python scripts/prepare_shirudo_binary.py --archive artifacts/upstream.zip --output artifacts/verifier
      - name: Cache source-pinned upstream build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            upstream/build/target-deps
            upstream/build/host-openssl
            upstream/build/host-libtpms
          key: shirudo-deps-ubuntu24-x64-fb97c1ec5908c8bdbd46760c29e57677977fce74-v1
      - name: Prepare upstream toolchain and pinned test kernel
        run: bash scripts/shirudo_ci_vm.sh setup "$PWD/upstream" "$VM_NAME"
      - name: Build and boot the disposable target
        run: bash scripts/shirudo_ci_vm.sh boot "$PWD/upstream" "$VM_NAME"
      - name: Verify fresh lab evidence and adverse controls
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          python scripts/shirudo_real_lab.py --upstream "$PWD/upstream" --vm-name "$VM_NAME" --verifier "$PWD/artifacts/verifier/shirudo" --output "$PWD/evidence/lab"
      - name: Stop the disposable VM
        if: always()
        run: bash scripts/shirudo_ci_vm.sh stop "$PWD/upstream" "$VM_NAME"
      - name: Retain only public qualification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shirudo-real-lab-${{ github.sha }}
          path: |
            evidence/
            artifacts/verifier/artifact.json
          if-no-files-found: error
          retention-days: 14
