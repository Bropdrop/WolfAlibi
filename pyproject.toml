[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfalibi-shirudo"
version = "0.1.0"
description = "Policy-bound, read-only assessment of Shirudo attestation evidence"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.0"]

[project.scripts]
wolfalibi-shirudo = "shirudo_adapter.cli:main"

[tool.setuptools]
packages = ["shirudo_adapter"]
