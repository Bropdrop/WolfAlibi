[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfalibi-shirudo"
version = "0.1.0"
description = "Policy-bound Shirudo evidence assessment and laboratory counter authorization"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.0"]

[project.scripts]
wolfalibi-shirudo = "shirudo_adapter.cli:main"
wolfalibi-shirudo-action-gate = "shirudo_adapter.action_gate_cli:main"
wolfalibi-shirudo-owner = "shirudo_adapter.owner_cli:main"

[tool.setuptools]
packages = ["shirudo_adapter"]
