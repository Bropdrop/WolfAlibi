<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Offline Quorvane evidence explorer for synthetic WolfAlibi research experiments.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>Evidence Explorer</title>
  <style>
:root {
  --paper: #f5f0e4;
  --paper-wash: #eee5d4;
  --paper-dark: #ded1bc;
  --paper-glass: rgba(255, 252, 244, 0.72);
  --ink: #163d37;
  --ink-soft: #48615a;
  --ink-faint: #708077;
  --rust: #a94d35;
  --rust-deep: #7d3022;
  --ochre: #b47b2d;
  --line: #cfc2ac;
  --line-dark: #a99b85;
  --white: #fffcf5;
  --alert: #8c3127;
  --ok: #245c49;
  --shadow: 0 16px 38px rgba(49, 52, 39, 0.10), 0 2px 5px rgba(49, 52, 39, 0.08);
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

html { background: var(--paper); }

body {
  min-width: 320px;
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 14% 4%, rgba(181, 130, 50, 0.11), transparent 24rem),
    radial-gradient(circle at 88% 18%, rgba(54, 99, 84, 0.09), transparent 27rem),
    linear-gradient(135deg, rgba(255,255,255,.35), transparent 45%),
    var(--paper);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
}

body::before {
  position: fixed;
  z-index: -1;
  inset: 0;
  content: "";
  opacity: .38;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(0deg, rgba(22,61,55,.018) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(90deg, rgba(169,77,53,.012) 0 1px, transparent 1px 7px);
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .58; }

a { color: var(--rust-deep); }

.lab-shell { max-width: 1440px; margin: 0 auto; padding: 0 30px; }

.skip-link {
  position: fixed;
  z-index: 20;
  top: 10px;
  left: 12px;
  transform: translateY(-160%);
  padding: 9px 13px;
  color: var(--white);
  background: var(--ink);
  border-radius: 3px;
  box-shadow: var(--shadow);
}
.skip-link:focus { transform: translateY(0); }

.site-header { padding: 30px 0 0; }

.masthead {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line-dark);
}

.wordmark { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); }
.wordmark strong {
  display: block;
  font-family: var(--serif);
  font-size: clamp(1.48rem, 3vw, 2rem);
  font-weight: 600;
  letter-spacing: -.035em;
  line-height: .95;
}
.wordmark small {
  display: block;
  margin-top: 5px;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .105em;
  text-transform: uppercase;
}
.wordmark-mark {
  position: relative;
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--ink);
  border-radius: 50%;
}
.wordmark-mark::before, .wordmark-mark::after {
  position: absolute;
  width: 23px;
  height: 23px;
  content: "";
  border: 1px solid var(--rust);
  border-radius: 50%;
}
.wordmark-mark::after { width: 12px; height: 12px; border-color: var(--ink); }
.wordmark-mark i { position: absolute; display: block; width: 1px; height: 30px; background: var(--ink); transform: rotate(var(--angle)); opacity: .8; }
.wordmark-mark i:nth-child(1) { --angle: 18deg; }
.wordmark-mark i:nth-child(2) { --angle: 72deg; }
.wordmark-mark i:nth-child(3) { --angle: 136deg; }

.offline-note {
  max-width: 380px;
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: .69rem;
  letter-spacing: .045em;
  line-height: 1.45;
  text-align: right;
  text-transform: uppercase;
}

.primary-nav { display: flex; gap: 2px; padding-top: 12px; overflow-x: auto; }
.nav-tab {
  position: relative;
  min-height: 43px;
  padding: 10px 15px 12px;
  color: var(--ink-soft);
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  font-size: .83rem;
  font-weight: 650;
  white-space: nowrap;
}
.nav-tab:hover { color: var(--ink); }
.nav-tab.is-active { color: var(--ink); border-bottom-color: var(--rust); }

main { padding: 34px 0 60px; }
.view-panel[hidden] { display: none; }
.view-panel:focus { outline: none; }

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(300px, .88fr);
  min-height: 324px;
  overflow: hidden;
  border: 1px solid var(--line-dark);
  background: var(--paper-glass);
  box-shadow: var(--shadow);
}
.hero-copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(30px, 5vw, 68px); }
.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 16px;
  color: var(--rust-deep);
  font-family: var(--mono);
  font-size: .66rem;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
}
.eyebrow::before { width: 27px; height: 1px; content: ""; background: currentColor; }
.hero h1 {
  max-width: 680px;
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2.2rem, 5vw, 4.55rem);
  font-weight: 500;
  letter-spacing: -.052em;
  line-height: .91;
}
.hero h1 em { color: var(--rust); font-style: normal; }
.hero-lede { max-width: 620px; margin: 22px 0 0; color: var(--ink-soft); font-size: clamp(.98rem, 1.7vw, 1.12rem); }
.hero-meta { display: flex; flex-wrap: wrap; gap: 7px 25px; margin-top: 28px; color: var(--ink-soft); font-family: var(--mono); font-size: .7rem; }
.hero-meta span { display: inline-flex; gap: 7px; align-items: baseline; }
.hero-meta b { color: var(--ink); font-weight: 700; }

.fingerprint {
  position: relative;
  min-height: 300px;
  overflow: hidden;
  border-left: 1px solid var(--line);
  background: var(--ink);
}
.fingerprint::before {
  position: absolute;
  z-index: 1;
  inset: 18px;
  content: "";
  pointer-events: none;
  border: 1px solid rgba(245,240,228,.28);
}
.fingerprint-canvas { display: block; width: 100%; height: 100%; min-height: 300px; }
.fingerprint-caption {
  position: absolute;
  z-index: 2;
  right: 29px;
  bottom: 27px;
  left: 29px;
  color: rgba(255,252,245,.9);
  font-family: var(--mono);
  font-size: .63rem;
  letter-spacing: .07em;
  line-height: 1.6;
  text-transform: uppercase;
}
.fingerprint-caption code { display: block; overflow: hidden; color: #f4c27a; text-overflow: ellipsis; white-space: nowrap; }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 54px 0 18px; }
.section-head h2, .detail-title, .assurance-title, .review-title {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(1.55rem, 3vw, 2.35rem);
  font-weight: 500;
  letter-spacing: -.035em;
  line-height: 1;
}
.section-head p { max-width: 500px; margin: 0; color: var(--ink-soft); font-size: .91rem; text-align: right; }

.experiment-rail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.experiment-card {
  display: grid;
  min-height: 183px;
  padding: 20px;
  color: var(--ink);
  text-align: left;
  background: rgba(255,252,245,.56);
  border: 1px solid var(--line);
  border-radius: 1px;
  transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.experiment-card:hover { border-color: var(--ink-soft); transform: translateY(-2px); box-shadow: 0 8px 16px rgba(49,52,39,.08); }
.experiment-card.is-selected { color: var(--white); background: var(--ink); border-color: var(--ink); }
.experiment-card.is-selected .experiment-card-meta, .experiment-card.is-selected .experiment-card-desc { color: rgba(255,252,245,.72); }
.experiment-card-index { color: var(--rust); font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; }
.experiment-card.is-selected .experiment-card-index { color: #e9b066; }
.experiment-card-title { align-self: center; margin: 14px 0 7px; font-family: var(--serif); font-size: 1.45rem; font-weight: 500; letter-spacing: -.025em; line-height: 1.03; }
.experiment-card-desc { margin: 0; color: var(--ink-soft); font-size: .79rem; line-height: 1.42; }
.experiment-card-meta { margin-top: 17px; color: var(--ink-faint); font-family: var(--mono); font-size: .61rem; letter-spacing: .05em; text-transform: uppercase; }

.experiment-detail { margin-top: 16px; border-top: 3px solid var(--ink); background: var(--paper-glass); box-shadow: var(--shadow); }
.detail-header { display: grid; grid-template-columns: minmax(0, 1fr) minmax(210px, .55fr); gap: 36px; padding: 30px 32px; border-bottom: 1px solid var(--line); }
.detail-kicker { margin: 0 0 8px; color: var(--rust-deep); font-family: var(--mono); font-size: .66rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.detail-description { max-width: 760px; margin: 16px 0 0; color: var(--ink-soft); }
.claim-block { align-self: center; padding: 18px 0 18px 21px; border-left: 2px solid var(--rust); }
.micro-label { display: block; margin-bottom: 8px; color: var(--ink-faint); font-family: var(--mono); font-size: .62rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.claim-block p { margin: 0; font-family: var(--serif); font-size: 1.05rem; line-height: 1.22; }
.claim-block p { overflow-wrap: anywhere; }

.source-strip { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.source-cell { min-width: 0; padding: 13px 18px; border-right: 1px solid var(--line); }
.source-cell:last-child { border-right: 0; }
.source-cell code { display: block; overflow: hidden; color: var(--ink); font-family: var(--mono); font-size: .7rem; text-overflow: ellipsis; white-space: nowrap; }

.detail-workbench { display: grid; grid-template-columns: minmax(310px, .86fr) minmax(0, 1.14fr); }
.verification-column { min-width: 0; padding: 28px 28px 31px; border-right: 1px solid var(--line); }
.evidence-column { min-width: 0; padding: 28px; }
.subhead { display: flex; justify-content: space-between; gap: 15px; align-items: baseline; margin: 0 0 15px; }
.subhead h3 { margin: 0; font-family: var(--serif); font-size: 1.32rem; font-weight: 500; letter-spacing: -.02em; }
.subhead p { margin: 0; color: var(--ink-soft); font-size: .76rem; }

.variant-control { margin: 0 0 18px; }
.variant-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.variant-button {
  min-height: 48px;
  padding: 9px 11px;
  color: var(--ink-soft);
  text-align: left;
  background: rgba(255,252,245,.65);
  border: 1px solid var(--line-dark);
  border-radius: 2px;
}
.variant-button:hover { border-color: var(--ink); color: var(--ink); }
.variant-button.is-active { color: var(--white); background: var(--ink); border-color: var(--ink); }
.variant-button strong { display: block; font-size: .8rem; }
.variant-button small { display: block; margin-top: 2px; font-family: var(--mono); font-size: .57rem; letter-spacing: .035em; text-transform: uppercase; }

.verdict-panel { padding: 17px; background: #eee7d8; border: 1px solid var(--line); }
.verdict-panel.is-rejected { background: #f0ddd5; border-color: #c88a7b; }
.verdict-panel.is-verified { background: #e0ebe2; border-color: #8fa79a; }
.verdict-panel.is-neutral { background: #eee7d8; }
.verdict-label { margin: 0 0 10px; color: var(--ink-soft); font-family: var(--mono); font-size: .62rem; font-weight: 700; letter-spacing: .075em; text-transform: uppercase; }
.verdict-outcome { display: flex; align-items: baseline; gap: 12px; margin: 0; }
.verdict-outcome b { font-family: var(--serif); font-size: 1.56rem; font-weight: 500; letter-spacing: -.03em; }
.verdict-outcome code { overflow: hidden; color: var(--rust-deep); font-family: var(--mono); font-size: .65rem; text-overflow: ellipsis; white-space: nowrap; }
.verdict-detail { margin: 11px 0 0; color: var(--ink-soft); font-size: .81rem; }

.check-stack { display: grid; gap: 11px; margin-top: 18px; }
.check-card { padding: 15px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.check-card h4 { margin: 0; font-size: .81rem; }
.check-card p { margin: 5px 0 0; color: var(--ink-soft); font-size: .75rem; line-height: 1.45; }
.check-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }

.button, .button-quiet, .file-label {
  min-height: 35px;
  padding: 7px 10px;
  border-radius: 2px;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .01em;
}
.button { color: var(--white); background: var(--ink); border: 1px solid var(--ink); }
.button:hover { background: #0d2d28; }
.button-rust { background: var(--rust); border-color: var(--rust); }
.button-rust:hover { background: var(--rust-deep); }
.button-quiet, .file-label { color: var(--ink); background: transparent; border: 1px solid var(--line-dark); }
.button-quiet:hover, .file-label:hover { border-color: var(--ink); background: rgba(255,252,245,.7); }
.file-label input { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.integrity-result { min-height: 1.1em; color: var(--ink-soft); font-family: var(--mono); font-size: .64rem; line-height: 1.45; }
.integrity-result.is-match { color: var(--ok); }
.integrity-result.is-mismatch { color: var(--alert); }

.command-panel { margin-top: 20px; padding: 16px; background: #e5dcc9; border-left: 2px solid var(--rust); }
.command-panel h4 { margin: 0; font-family: var(--serif); font-size: 1.05rem; font-weight: 500; }
.command-panel p { margin: 5px 0 11px; color: var(--ink-soft); font-size: .74rem; }
.command-line { position: relative; display: flex; align-items: stretch; gap: 7px; }
.command-line code { flex: 1; min-width: 0; padding: 9px; overflow: auto hidden; color: #f7eddb; background: #153b35; font-family: var(--mono); font-size: .65rem; line-height: 1.4; white-space: nowrap; }
.command-line .button-quiet { flex: 0 0 auto; background: var(--paper); }

.artifact-tabs { display: flex; gap: 5px; padding-bottom: 13px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.artifact-tab { min-height: 32px; padding: 5px 8px; color: var(--ink-soft); background: transparent; border: 0; border-bottom: 2px solid transparent; font-family: var(--mono); font-size: .66rem; white-space: nowrap; }
.artifact-tab.is-active { color: var(--rust-deep); border-bottom-color: var(--rust); font-weight: 700; }
.artifact-tools { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; padding: 13px 0; }
.artifact-meta { max-width: 100%; overflow: hidden; color: var(--ink-soft); font-family: var(--mono); font-size: .62rem; text-overflow: ellipsis; white-space: nowrap; }
.artifact-actions { display: flex; flex-wrap: wrap; gap: 7px; }
.evidence-pre {
  min-height: 315px;
  max-height: 610px;
  margin: 0;
  padding: 16px;
  overflow: auto;
  color: #ebeadc;
  background: #153b35;
  border: 1px solid #0b2723;
  font-family: var(--mono);
  font-size: .7rem;
  line-height: 1.55;
  tab-size: 2;
  white-space: pre;
}

.assurance-intro, .review-intro { max-width: 750px; margin: 0 0 27px; color: var(--ink-soft); font-size: 1.02rem; }
.assurance-matrix { overflow: auto; border-top: 3px solid var(--ink); box-shadow: var(--shadow); }
.condition-table { width: 100%; min-width: 700px; border-collapse: collapse; background: var(--paper-glass); }
.condition-table th, .condition-table td { padding: 18px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.condition-table th { color: var(--ink-soft); font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; }
.condition-table td:first-child { width: 26%; font-family: var(--serif); font-size: 1.04rem; }
.condition-table td:last-child { color: var(--ink-soft); font-size: .84rem; }
.condition-status { display: inline-block; min-width: 116px; color: var(--ink); font-family: var(--mono); font-size: .65rem; font-weight: 700; letter-spacing: .055em; }
.condition-status::before { display: inline-block; width: 7px; height: 7px; margin-right: 7px; content: ""; background: var(--ink-faint); border-radius: 50%; }
.condition-status.status-TESTED::before { background: var(--ok); }
.condition-status.status-UNSUPPORTED::before, .condition-status.status-NOT_ASSESSED::before { background: var(--ochre); }
.condition-status.status-BLOCKED::before, .condition-status.status-NOT_ISSUED::before { background: var(--rust); }
.assurance-notice { margin-top: 22px; padding: 18px 20px; color: var(--ink-soft); border: 1px solid var(--line-dark); border-left: 3px solid var(--rust); }
.assurance-notice strong { color: var(--ink); }

.review-layout { display: grid; grid-template-columns: minmax(220px, .5fr) minmax(0, 1fr); gap: 34px; align-items: start; }
.review-aside { padding: 23px; border-top: 3px solid var(--rust); background: rgba(229,220,201,.58); }
.review-aside h3 { margin: 0; font-family: var(--serif); font-size: 1.5rem; font-weight: 500; }
.review-aside p, .review-aside li { color: var(--ink-soft); font-size: .8rem; }
.review-aside ul { padding-left: 18px; }
.review-aside code { display: block; padding: 9px; overflow-x: auto; color: #f7eddb; background: var(--ink); font-family: var(--mono); font-size: .61rem; line-height: 1.5; }
.finding-form { padding: 27px; border-top: 3px solid var(--ink); background: var(--paper-glass); box-shadow: var(--shadow); }
.finding-form h3 { margin: 0; font-family: var(--serif); font-size: 1.65rem; font-weight: 500; letter-spacing: -.025em; }
.finding-form > p { margin: 7px 0 22px; color: var(--ink-soft); font-size: .82rem; }
.finding-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
.finding-grid > div { min-width: 0; }
.finding-grid .field-wide { grid-column: 1 / -1; }
.field-label { display: block; margin: 0 0 6px; color: var(--ink-soft); font-family: var(--mono); font-size: .64rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.field-readout { display: block; min-width: 0; min-height: 39px; padding: 9px 10px; overflow: hidden; color: var(--ink); background: #eee6d5; border: 1px solid var(--line); font-family: var(--mono); font-size: .69rem; text-overflow: ellipsis; white-space: nowrap; }
.finding-form input, .finding-form textarea {
  width: 100%;
  color: var(--ink);
  background: rgba(255,252,245,.78);
  border: 1px solid var(--line-dark);
  border-radius: 1px;
}
.finding-form input { min-height: 39px; padding: 8px 10px; }
.finding-form textarea { min-height: 94px; padding: 10px; resize: vertical; }
.finding-form input:focus, .finding-form textarea:focus { border-color: var(--rust); outline: 3px solid rgba(169,77,53,.17); }
.form-note { margin: 15px 0; color: var(--ink-soft); font-size: .74rem; }
.form-status { min-height: 1.4em; margin: 11px 0 0; color: var(--ink-soft); font-family: var(--mono); font-size: .68rem; }
.form-status.is-error { color: var(--alert); }
.form-status.is-ok { color: var(--ok); }

.toast {
  position: fixed;
  z-index: 30;
  right: 20px;
  bottom: 20px;
  max-width: min(390px, calc(100vw - 40px));
  padding: 12px 15px;
  color: var(--white);
  background: var(--ink);
  box-shadow: var(--shadow);
  font-size: .8rem;
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: opacity .18s ease, transform .18s ease;
}
.toast.is-visible { opacity: 1; transform: translateY(0); }

.site-footer { display: flex; justify-content: space-between; gap: 20px; padding: 19px 0 25px; color: var(--ink-soft); border-top: 1px solid var(--line-dark); font-family: var(--mono); font-size: .63rem; letter-spacing: .04em; text-transform: uppercase; }
.noscript-note { max-width: 900px; margin: 20px auto; padding: 16px; color: var(--ink); background: #f0ddd5; border-left: 3px solid var(--rust); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

:focus-visible { outline: 3px solid rgba(169,77,53,.75); outline-offset: 3px; }

@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; }
  .fingerprint { min-height: 240px; border-top: 1px solid var(--line); border-left: 0; }
  .fingerprint-canvas { min-height: 240px; }
  .experiment-rail { grid-template-columns: 1fr; }
  .experiment-card { min-height: 130px; }
  .detail-workbench { grid-template-columns: minmax(0, 1fr); }
  .verification-column { border-right: 0; border-bottom: 1px solid var(--line); }
  .review-layout { grid-template-columns: 1fr; }
}

@media (max-width: 680px) {
  .lab-shell { padding: 0 16px; }
  .site-header { padding-top: 17px; }

/* A narrow browser check of the signed record and its content bindings.
   The Python verifiers also check the original authorization chain. */
(() => {
  'use strict';
  const encoder = new TextEncoder();

  function requireMatch(condition, message) {
    if (!condition) throw new Error(message);
  }

  // The published vectors contain printable ASCII, JSON containers and safe
  // integers. Stay inside that domain when matching alibi.canon() byte-for-byte.
  function canonical(value) {
    if (value === null || typeof value === 'boolean' || Number.isSafeInteger(value)) return JSON.stringify(value);
    if (typeof value === 'string' && /^[\x20-\x7e]*$/.test(value)) return JSON.stringify(value);
    if (Array.isArray(value)) return '[' + value.map(canonical).join(',') + ']';
    if (typeof value === 'object' && value !== null) {
      return '{' + Object.keys(value).sort().map(key => canonical(key) + ':' + canonical(value[key])).join(',') + '}';
    }
    throw new Error('Value outside the published vector format.');
  }

  function bytes(hex, length) {
    requireMatch(typeof hex === 'string' && hex.length === length * 2 && /^[0-9a-f]+$/.test(hex), 'Invalid key or signature encoding.');
    return Uint8Array.from(hex.match(/../g), pair => parseInt(pair, 16));
  }

  async function digest(value) {
    const data = await crypto.subtle.digest('SHA-256', encoder.encode(canonical(value)));
    return Array.from(new Uint8Array(data), byte => byte.toString(16).padStart(2, '0')).join('');
  }

  async function signature(record, publicKey, domain) {
    const key = await crypto.subtle.importKey('raw', bytes(publicKey, 32), {name: 'Ed25519'}, false, ['verify']);
    const signed = encoder.encode(domain + '\0' + canonical(record.payload));
    requireMatch(await crypto.subtle.verify('Ed25519', key, bytes(record.signature, 64), signed), 'The signature does not match the pinned public key.');
    return record.payload;
  }

  async function paymentOrAdmission(id, evidence, pins, challenge) {
    const record = await signature(evidence.receipt, pins.target_pub, 'quorvane/' + id + '/target-receipt/v1');
    requireMatch(record.type === (id === 'education' ? 'QUORVANE_EDUCATION_TARGET_RECEIPT_V1' : 'QUORVANE_FINANCE_TARGET_RECEIPT_V1'), 'Wrong receipt type.');
    requireMatch(record.target_pub === pins.target_pub && challenge === pins.scope.challenge &&
      record.request_id === pins.scope.request_id && canonical(pins.scope) === canonical(evidence.packet.scope), 'The recorded scope differs from the public expectations.');
    requireMatch(record.scope_sha256 === await digest(pins.scope) && record.packet_sha256 === await digest(evidence.packet), 'The packet differs from the one signed by the target.');
    if (id === 'education') {
      requireMatch(record.response_sha256 === pins.response_sha256 && record.response_sha256 === await digest(evidence.response), 'The fictional response differs from its signed digest.');
    } else {
      requireMatch(record.outcome === 'PENDING_EXTERNAL_SETTLEMENT', 'The signed receipt has an unexpected disposition.');
    }
  }

  window.quorvaneCheckRecord = async (id, envelopeText, pinsText, challengeText) => {
    if (!globalThis.crypto?.subtle) return {outcome: 'UNSUPPORTED', detail: 'Web Crypto is unavailable. Use the local Python verifier.'};
    try {
      const evidence = JSON.parse(envelopeText).evidence;
      const pins = JSON.parse(pinsText);
      const challenge = challengeText.trim();
      bytes(challenge, 32);
      if (id === 'history') {
        const record = await signature(evidence.attestation, pins.history_pub, 'quorvane/finance/history/disclosure/v1');
        requireMatch(record.type === 'QUORVANE_HISTORICAL_INTENT_DISCLOSURE_V1' && record.disposition === 'PENDING_EXTERNAL_SETTLEMENT', 'Unexpected disclosure type or disposition.');
        requireMatch(pins.challenge === challenge && record.challenge === challenge && evidence.request.challenge === challenge, 'The inquiry challenge differs from the pinned challenge.');
        requireMatch(record.anchor_sha256 === pins.anchor_sha256 && record.finance_expectations_sha256 === await digest(pins.finance) &&
          record.inquiry_sha256 === await digest(evidence.request) && record.original_receipt_sha256 === await digest(evidence.original.receipt), 'The archive or inquiry differs from the signed disclosure.');
        await paymentOrAdmission('finance', evidence.original, pins.finance, pins.finance.scope.challenge);
      } else {
        requireMatch(id === 'education' || id === 'finance', 'Unknown experiment.');
        await paymentOrAdmission(id, evidence, pins, challenge);
      }
      return {outcome: 'MATCH', detail: 'The signature and record bindings match the supplied public inputs.'};
    } catch (error) {
      if (error.name === 'NotSupportedError') return {outcome: 'UNSUPPORTED', detail: 'Ed25519 is unavailable here. Use the local Python verifier.'};
      return {outcome: 'REJECTED', detail: error.message || 'The signed record check failed.'};
    }
  };
})();

(() => {
  "use strict";

  const dataNode = document.getElementById("lab-data");
  const panels = {
    overview: document.getElementById("panel-overview"),
    assurance: document.getElementById("panel-assurance"),
    review: document.getElementById("panel-review"),

  const announcer = create("p", { className: "sr-only", "aria-live": "polite", "aria-atomic": "true" });

  let data;
  try {
    data = JSON.parse(dataNode ? dataNode.textContent : "{}");
  } catch (error) {
    renderFatal("The embedded lab data could not be parsed.");
    return;
  }

  const manifest = isPlainObject(data.manifest) ? data.manifest : {};
  const cases = isPlainObject(data.cases) ? data.cases : {};

  let toastTimer = 0;

  renderAssurance();
  renderReview();
  renderOverview();
  bindNavigation();
  window.addEventListener("resize", () => {
    if (resizeFrame) return;
    resizeFrame = window.requestAnimationFrame(() => {
      resizeFrame = 0;
      drawFingerprint();
    });
  }, { passive: true });

  function isPlainObject(value) {
    return value !== null && typeof value === "object" && !Array.isArray(value);
  }

  function create(tag, attributes, ...children) {
    const node = document.createElement(tag);
    if (attributes) {
      Object.entries(attributes).forEach(([key, value]) => {
        if (value === undefined || value === null || value === false) return;
        if (key === "className") node.className = value;
        else if (key === "text") node.textContent = String(value);
        else if (key === "htmlFor") node.htmlFor = value;
        else if (key === "dataset" && isPlainObject(value)) Object.entries(value).forEach(([name, item]) => { node.dataset[name] = String(item); });
        else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2).toLowerCase(), value);
        else node.setAttribute(key, value === true ? "" : String(value));
      });
    }
    children.flat().forEach((child) => {

    return isPlainObject(cases[currentExperiment().id]) ? cases[currentExperiment().id] : {};

  function rawArtifact(name = state.artifact) {
    const raw = currentCase().raw;
    return isPlainObject(raw) && typeof raw[name] === "string" ? raw[name] : "";

  function artifactHash(name = state.artifact, experiment = currentExperiment()) {
    const files = isPlainObject(experiment.files) ? experiment.files : {};

    );
  }

  function signedRecordCheck(experiment) {
    const check = create("section", { className: "check-card", "aria-labelledby": "signed-check-title" },
      create("h4", { id: "signed-check-title", text: "Signed-record check" }),
      create("p", { text: "Runs the bundled browser cryptography check over the selected record, public pins, and challenge. This is narrower than the saved canonical Python verifier result." }),
    );
    const result = create("p", { className: "integrity-result", "data-region": "signed-result", "aria-live": "polite", text: "Not run in this browser." });
    const button = create("button", { className: "button", type: "button", "data-action": "check-signed-record", text: "Check signed record" });
    button.addEventListener("click", async () => {
      button.disabled = true;
      result.className = "integrity-result";
      result.textContent = "Checking the selected signed record locally…";
      try {
        if (typeof window.quorvaneCheckRecord !== "function") {
          setLiveResult(result, { outcome: "UNSUPPORTED", detail: "The bundled WebCrypto verifier is unavailable in this browser build." });
          return;
        }
        const output = await window.quorvaneCheckRecord(
          String(experiment.id), rawArtifact(`${state.variant}.json`), rawArtifact("pins.json"), rawArtifact("challenge.txt"),
        );
        if (!isPlainObject(output)) throw new Error("The bundled checker returned an invalid result.");
        setLiveResult(result, output);
      } catch (error) {
        setLiveResult(result, { outcome: "REJECTED", detail: error instanceof Error ? error.message : "Local signed-record check failed." });
      } finally {
        button.disabled = false;
      }
    });
    check.append(create("div", { className: "check-actions" }, button), result);
    return check;
  }

  function setLiveResult(node, output) {
    const outcome = asText(output.outcome, "UNSUPPORTED");
    const detail = asText(output.detail, "No local-check detail was returned.");
    node.textContent = `${outcome} — ${detail}`;
    node.className = `integrity-result ${outcome === "MATCH" ? "is-match" : outcome === "REJECTED" ? "is-mismatch" : ""}`;
  }

  function digestCheck(experiment) {
    const check = create("section", { className: "check-card", "aria-labelledby": "digest-check-title" },
      create("h4", { id: "digest-check-title", text: "Local file digest" }),
      create("p", { text: "Compares UTF-8 bytes with the manifest SHA-256 for the selected artifact. A match does not verify signatures or the complete authority chain." }),
    );
    const result = create("p", { className: "integrity-result", "data-region": "digest-result", "aria-live": "polite", text: "Not checked." });
    const packaged = create("button", { className: "button-quiet", type: "button", "data-action": "check-digest", text: "Check packaged bytes" });
    packaged.addEventListener("click", async () => {
      const expected = artifactHash();
      if (!expected) return setDigestResult(result, "UNSUPPORTED", "No manifest digest is recorded for this artifact.");
      try {
        const digest = await sha256Hex(new TextEncoder().encode(rawArtifact()));
        setDigestResult(result, digest === expected ? "MATCH" : "MISMATCH", digest === expected ? `Matches published SHA-256 ${shortHash(expected)}.` : `Does not match published SHA-256 ${shortHash(expected)}.`);
      } catch (error) {
        setDigestResult(result, "UNSUPPORTED", "WebCrypto SHA-256 is unavailable in this browser.");
      }
    });
    const input = create("input", { type: "file", accept: ".json,.txt,application/json,text/plain", "aria-label": "Choose a local artifact to compare" });
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const expected = artifactHash();
      if (!expected) return setDigestResult(result, "UNSUPPORTED", "No manifest digest is recorded for this artifact.");
      try {
        const digest = await sha256Hex(await file.arrayBuffer());
        setDigestResult(result, digest === expected ? "MATCH" : "MISMATCH", digest === expected ? `${file.name} matches the published digest.` : `${file.name} does not match the published digest.`);
      } catch (error) {
        setDigestResult(result, "UNSUPPORTED", "The selected file could not be checked locally.");
      } finally {
        input.value = "";
      }
    });
    const label = create("label", { className: "file-label", text: "Compare a local file" }, input);
    check.append(create("div", { className: "check-actions" }, packaged, label), result);
    return check;
  }

  function setDigestResult(node, outcome, detail) {
    node.textContent = `${outcome} — ${detail}`;
    node.className = `integrity-result ${outcome === "MATCH" ? "is-match" : outcome === "MISMATCH" ? "is-mismatch" : ""}`;
  }

  function commandPanel() {
    const command = asText(currentCase().commands && currentCase().commands[state.variant], "python scripts/public_lab.py verify");
    const copy = create("button", { className: "button-quiet", type: "button", "data-action": "copy-command", "aria-label": "Copy verifier command", text: "Copy" });
    copy.addEventListener("click", () => copyText(command, "Verifier command copied."));
    return create("section", { className: "command-panel", "aria-label": "Published verifier command" },
      create("h4", { text: "Run the complete verifier locally" }),
      create("p", { text: "The recorded result above came from the canonical verifier. Run its exact published command outside the browser for the complete authority-chain check." }),
      create("div", { className: "command-line", "data-region": "command" }, create("code", { text: command }), copy),
    );
  }

  function evidenceColumn(experiment) {
    const column = create("div", { className: "evidence-column" }, create("div", { className: "subhead" }, create("h3", { text: "Public evidence" }), create("p", { text: "Exact embedded bytes" })));
    const artifacts = ["genuine.json", "tampered.json", "pins.json", "challenge.txt"].filter((name) => rawArtifact(name) || artifactHash(name, experiment));
    if (!artifacts.includes(state.artifact)) state.artifact = artifacts[0] || "genuine.json";
    const tabsNode = create("div", { className: "artifact-tabs", role: "tablist", "aria-label": "Evidence artifact" });
    artifacts.forEach((artifact) => {
      const active = artifact === state.artifact;
      const button = create("button", {
        className: `artifact-tab${active ? " is-active" : ""}`,
        type: "button",
        role: "tab",
        "aria-selected": String(active),
        "data-artifact": artifact,
        "data-action": "select-artifact",
        text: artifact,
      });
      button.addEventListener("click", () => {
        state.artifact = artifact;
        renderOverview();
        const next = panels.overview.querySelector(`[data-artifact="${cssEscape(artifact)}"]`);
        if (next) next.focus();
      });
      tabsNode.append(button);
    });
    const raw = rawArtifact();
    const expected = artifactHash();
    const copy = create("button", { className: "button-quiet", type: "button", "data-action": "copy-artifact", text: "Copy exact bytes" });
    copy.addEventListener("click", () => copyText(raw, `${state.artifact} copied.`));
    const download = create("button", { className: "button", type: "button", "data-action": "download-artifact", text: "Download artifact" });
    download.addEventListener("click", () => downloadText(state.artifact, raw, state.artifact.endsWith(".json") ? "application/json;charset=utf-8" : "text/plain;charset=utf-8"));
    const downloadPins = create("button", { className: "button-quiet", type: "button", "data-action": "download-public-keys", text: "Download public keys" });
    downloadPins.addEventListener("click", () => downloadText("pins.json", rawArtifact("pins.json"), "application/json;charset=utf-8"));
    const tools = create("div", { className: "artifact-tools" },
      create("span", { className: "artifact-meta", text: expected ? `Manifest SHA-256: ${expected}` : "No manifest digest recorded for this artifact." }),
      create("div", { className: "artifact-actions" }, copy, download, downloadPins),
    );
    const pre = create("pre", { className: "evidence-pre", tabindex: "0", "aria-label": `Exact content of ${state.artifact}`, text: raw || "Artifact text is unavailable." });
    column.append(tabsNode, tools, pre);
    return column;
  }

  function renderAssurance() {
    const conditions = Array.isArray(manifest.conditions) ? manifest.conditions.filter(isPlainObject) : [];
    const base = isPlainObject(manifest.base) ? manifest.base : {};
    const section = create("div", null,
      create("p", { className: "eyebrow", text: "Assurance boundary" }),
      create("h1", { className: "assurance-title", text: "What this artifact does—and does not—establish" }),
      create("p", { className: "assurance-intro", text: "Conditions are recorded from the qualified research runs. A signed or hashed record authenticates only its declared, bounded statement; it does not upgrade unsupported controls into a production claim." }),
    );
    const table = create("table", { className: "condition-table" });
    const head = create("thead", null, create("tr", null, create("th", { text: "Condition" }), create("th", { text: "Recorded status" }), create("th", { text: "Evidence boundary" })));
    const body = create("tbody");
    conditions.forEach((condition) => {
      const status = asText(condition.status, "NOT_ASSESSED");
      body.append(create("tr", { "data-condition-id": asText(condition.id, "") },
        create("td", { text: asText(condition.title, condition.id) }),
        create("td", null, create("span", { className: `condition-status status-${status}`, text: status.replaceAll("_", " ") })),
        create("td", { text: asText(condition.detail, "No explanatory detail was recorded.") }),
      ));
    });
    if (!conditions.length) body.append(create("tr", null, create("td", { colspan: "3", text: "No assurance conditions were embedded in this artifact." })));
    table.append(head, body);
    section.append(create("div", { className: "assurance-matrix" }, table));
    section.append(create("aside", { className: "assurance-notice" }, create("strong", { text: "Source boundary. " }), `Base commit ${shortHash(base.commit)} / tree ${shortHash(base.tree)} / PR ${asText(base.pr, "not recorded")}. Independent escrow, full confinement, and production certification remain governed by their explicit recorded status.`));
    panels.assurance.replaceChildren(section);
  }

  function renderReview() {
    const experiment = currentExperiment();
    const reviewKey = `${String(experiment.id)}:${state.variant}`;
    if (panels.review.dataset.reviewKey === reviewKey && panels.review.childElementCount) return;
    const result = selectedResult();
    const rawCommand = asText(currentCase().commands && currentCase().commands[state.variant], "python scripts/public_lab.py verify");
    const expectedText = result.reason ? `Recorded ${asText(result.outcome, "outcome")} (${result.reason})` : `Recorded ${asText(result.outcome, "outcome")}`;
    const artifactDigest = artifactHash(`${state.variant}.json`, experiment);
    const layout = create("div", null,
      create("p", { className: "eyebrow", text: "Human review / local handoff" }),
      create("h1", { className: "review-title", text: "Record a browser finding" }),
      create("p", { className: "review-intro", text: "This page cannot submit findings or contact a service. It creates one exact JSON file for manual review; do not include credentials, private material, or real-world records." }),
    );
    const aside = create("aside", { className: "review-aside" },
      create("h3", { text: "Local-only workflow" }),
      create("p", { text: "The form never stores or transmits your text automatically. Download the JSON, review it, then choose whether to submit it through the local review command." }),
      create("ol", null,
        create("li", { text: "Inspect the selected public artifact and recorded result." }),
        create("li", { text: "Describe reproducible observations without sensitive data." }),
        create("li", { text: "Download the local JSON and submit it manually if appropriate." }),
      ),
      create("code", { text: "python scripts/public_lab_finding.py submit finding.json --inbox review-inbox" }),
    );
    const form = create("form", { className: "finding-form", "data-form": "finding", autocomplete: "off", novalidate: "" },
      create("h3", { text: "Finding manifest" }),
      create("p", { text: "Required fields are exported exactly in the local finding schema. No credential fields are present." }),
    );
    const fields = create("div", { className: "finding-grid" });
    fields.append(readoutField("Experiment", experiment.id), readoutField("Variant", state.variant), readoutField("Artifact SHA-256", artifactDigest), readoutField("Manifest SHA-256", asText(data.manifest_sha256, "missing")));
    fields.append(inputField("Environment", "environment", "Local browser review — update with browser and OS", false),
      inputField("Steps", "steps", rawCommand, true),
      inputField("Expected", "expected", expectedText, true),
      inputField("Observed", "observed", "", true, "Describe the observed result without sensitive data."));
    const status = create("p", { className: "form-status", "aria-live": "polite", "data-region": "finding-status" });
    const download = create("button", { className: "button button-rust", type: "submit", "data-action": "download-finding", text: "Download local finding JSON" });
    form.append(fields, create("p", { className: "form-note", text: "No automatic persistence. The downloaded file contains only the declared public-artifact reference and the four review fields." }), download, status);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const values = ["environment", "steps", "expected", "observed"].reduce((memo, key) => ({ ...memo, [key]: String(formData.get(key) || "").trim() }), {});
      const invalidField = Object.entries(values).find(([, value]) => !value || value.includes("\0") || new TextEncoder().encode(value).byteLength > 4096);
      if (!data.manifest_sha256 || !artifactDigest || invalidField) {
        status.className = "form-status is-error";
        status.textContent = invalidField
          ? `${invalidField[0]} must be nonempty, contain no NUL, and be at most 4096 UTF-8 bytes.`
          : "A manifest digest and artifact digest are required before download.";
        return;
      }
      const finding = {
        schema: "quorvane.public-lab.finding.v1",
        experiment: String(experiment.id),
        variant: state.variant,
        artifact_sha256: artifactDigest,
        manifest_sha256: String(data.manifest_sha256),
        environment: values.environment,
        steps: values.steps,
        expected: values.expected,
        observed: values.observed,
      };
      downloadText("finding.json", `${JSON.stringify(finding, null, 2)}\n`, "application/json;charset=utf-8");
      status.className = "form-status is-ok";
      status.textContent = "Local finding JSON downloaded. It was not sent or stored by this page.";
    });
    layout.append(create("div", { className: "review-layout" }, aside, form));
    panels.review.replaceChildren(layout);
    panels.review.dataset.reviewKey = reviewKey;
  }

  function readoutField(label, value) {
    return create("div", null, create("span", { className: "field-label", text: label }), create("div", { className: "field-readout", text: asText(value, "not recorded") }));
  }

  function inputField(label, name, value, multiline, placeholder = "") {
    const field = create("div", { className: multiline ? "field-wide" : "" });
    const id = `finding-${name}`;
    const control = multiline
      ? create("textarea", { id, name, required: "", rows: name === "observed" ? "5" : "4", placeholder, text: value })
      : create("input", { id, name, type: "text", required: "", value, placeholder });
    field.append(create("label", { className: "field-label", htmlFor: id, text: label }), control);
    return field;
  }

  function bindNavigation() {
    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => showView(tab.dataset.view, true));
      tab.addEventListener("keydown", (event) => {
        const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
        if (!keys.includes(event.key)) return;
        event.preventDefault();
        let next = index;
        if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
        if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
        if (event.key === "Home") next = 0;
        if (event.key === "End") next = tabs.length - 1;
        tabs[next].focus();
        showView(tabs[next].dataset.view, false);
      });
    });
  }

  function showView(view, moveFocus) {
    if (!panels[view]) return;
    state.view = view;
    tabs.forEach((tab) => {
      const active = tab.dataset.view === view;
      tab.classList.toggle("is-active", active);
      tab.setAttribute("aria-selected", String(active));
      tab.tabIndex = active ? 0 : -1;
    });
    Object.entries(panels).forEach(([name, panel]) => {
      const active = name === view;
      panel.hidden = !active;
      panel.classList.toggle("is-active", active);
    });
    if (view === "review") renderReview();
    if (moveFocus) main.focus();
  }

  async function sha256Hex(bytes) {
    if (!window.crypto || !window.crypto.subtle) throw new Error("WebCrypto unavailable");
    const digest = await window.crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
  }

  function drawFingerprint() {
    const canvas = document.getElementById("fingerprint-canvas");
    if (!canvas) return;
    const box = canvas.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(box.width * ratio);
    canvas.height = Math.floor(box.height * ratio);
    const context = canvas.getContext("2d");
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    const width = box.width;
    const height = box.height;
    const hash = artifactHash("genuine.json") || artifactHash() || "0".repeat(64);
    const bytes = Array.from({ length: 32 }, (_, index) => Number.parseInt(hash.slice(index * 2, index * 2 + 2), 16) || 0);
    const background = context.createLinearGradient(0, 0, width, height);
    background.addColorStop(0, "#163d37");
    background.addColorStop(.55, "#0b302c");
    background.addColorStop(1, "#173d36");
    context.fillStyle = background;
    context.fillRect(0, 0, width, height);
    context.lineCap = "round";
    context.lineJoin = "round";
    for (let grid = 1; grid < 7; grid += 1) {
      context.strokeStyle = "rgba(198,234,209,.075)";
      context.lineWidth = .75;
      context.beginPath();
      context.moveTo((width / 7) * grid, 0);
      context.lineTo((width / 7) * grid, height);
      context.moveTo(0, (height / 5) * (grid - 1));
      context.lineTo(width, (height / 5) * (grid - 1));
      context.stroke();
    }
    const centerX = width * (.43 + (bytes[0] / 255) * .16);
    const centerY = height * (.44 + (bytes[1] / 255) * .12);
    const tilt = ((bytes[2] / 255) - .5) * .42;
    const phase = (bytes[3] / 255) * Math.PI * 2;
    const contourCount = 29;
    context.save();
    context.translate(centerX, centerY);
    context.rotate(tilt);
    for (let layer = 0; layer < contourCount; layer += 1) {
      const step = layer / (contourCount - 1);
      const rx = width * (.53 - step * .43);
      const ry = height * (.66 - step * .52);
      const ridgePhase = phase + (bytes[(layer + 6) % bytes.length] / 255) * .42;
      const skew = (bytes[(layer + 12) % bytes.length] / 255 - .5) * 18;
      context.strokeStyle = layer % 6 === 0
        ? "rgba(231,151,83,.92)"
        : `rgba(184,232,204,${.38 + (layer % 5) * .075})`;
      context.lineWidth = layer % 6 === 0 ? 1.42 : .94;
      context.beginPath();
      // A nested, tilted contour is distorted by several digest-derived waves;
      // it reads as a single physical ridge rather than unrelated trace lines.
      for (let degrees = 0; degrees <= 360; degrees += 2) {
        const theta = (degrees / 180) * Math.PI;
        const shoulder = Math.sin(theta * 2 + ridgePhase) * (7 + (bytes[(layer + 19) % bytes.length] / 255) * 8) * (1 - step * .45);
        const grain = Math.sin(theta * (3 + (bytes[(layer + 23) % bytes.length] % 3)) - ridgePhase) * (3 + (bytes[(layer + 27) % bytes.length] / 255) * 4);
        const radial = 1 + Math.sin(theta * 3 + ridgePhase) * (.035 + (bytes[(layer + 9) % bytes.length] / 255) * .03);
        const asymmetric = Math.max(0, Math.sin(theta - .35)) * (1 - step) * (10 + (bytes[(layer + 15) % bytes.length] / 255) * 10);
        const x = Math.cos(theta) * rx * radial + shoulder + skew * Math.sin(theta);
        const y = Math.sin(theta) * ry * radial + grain - asymmetric;
        if (degrees === 0) context.moveTo(x, y); else context.lineTo(x, y);
      }
      context.closePath();
      context.stroke();
    }
    // A restrained internal bifurcation makes the contour nest visibly
    // asymmetric while retaining a stable fingerprint/topographic silhouette.
    for (let branch = 0; branch < 5; branch += 1) {
      const offset = (branch - 2) * 8;
      context.strokeStyle = branch === 2 ? "rgba(231,151,83,.82)" : "rgba(184,232,204,.42)";
      context.lineWidth = branch === 2 ? 1.2 : .8;
      context.beginPath();
      for (let t = -1.05; t <= 1.05; t += .025) {
        const x = t * width * .31 + Math.sin(t * 6 + phase) * (6 + branch);
        const y = offset + Math.sin(t * Math.PI + phase) * height * .13 + t * t * height * .105;
        if (t <= -1.04) context.moveTo(x, y); else context.lineTo(x, y);
      }
      context.stroke();
    }
    context.restore();
  }

  async function copyText(value, message) {
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
      else {
        const area = create("textarea", { text: value, "aria-hidden": "true" });
        area.style.cssText = "position:fixed;left:-9999px;top:0";
        document.body.append(area);
        area.select();
        const copied = document.execCommand("copy");
        area.remove();
        if (!copied) throw new Error("Copy command was unavailable");
      }
      showToast(message);
    } catch (error) {
      showToast("Copy was unavailable. Select the displayed text instead.");
    }
  }

  function downloadText(name, value, mime) {
    const blob = new Blob([value], { type: mime });
    const url = URL.createObjectURL(blob);
    const anchor = create("a", { href: url, download: name });
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 500);
    showToast(`${name} downloaded locally.`);
  }

  function showToast(message) {
    let toast = document.querySelector(".toast");
    if (!toast) {
      toast = create("div", { className: "toast", role: "status", "aria-live": "polite" });
      document.body.append(toast);
    }
    toast.textContent = message;
    toast.classList.add("is-visible");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2600);
  }

  function announce(message) {
    announcer.textContent = "";
    window.setTimeout(() => { announcer.textContent = message; }, 20);
  }

  function cssEscape(value) {
    if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(value);
    return String(value).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
  }

  function renderFatal(message) {
    const target = panels.overview || document.body;
    target.replaceChildren(create("section", { className: "assurance-notice" }, create("strong", { text: "Evidence explorer unavailable. " }), message));
  }
})();

</script>
</body>
</html>
